<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treino da semana</title>
<meta name="theme-color" content="#0B0B0B">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Uma coluna de celular: cabeçalho, dias em abas, um cartão por exercício e o cronômetro de descanso fixo embaixo.
   Marca: preto, amarelo e branco. */
@font-face{font-family:"Archivo";src:url(fonts/archivo.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Inter";src:url(fonts/inter.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url(fonts/jetbrainsmono.woff2) format("woff2");font-weight:100 800;font-display:swap}
:root{
  --preto:#0B0B0B; --carvao:#161616; --linha:#2A2A27; --cinza:#8C8A80; --apagado:#4A4944; --branco:#FAFAFA; --amarelo:#FFD60A; --verde:#3DDC84; --vermelho:#FF8A80;
  --f-titulo:"Archivo","Arial Narrow",Arial,sans-serif; --f-texto:"Inter",system-ui,sans-serif; --f-num:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--preto);color:var(--branco);-webkit-text-size-adjust:100%}
body{font-family:var(--f-texto);font-size:15px;line-height:1.45;padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) 140px max(16px,env(safe-area-inset-left,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--preto)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--amarelo);outline-offset:2px}
[hidden]{display:none!important}

header{display:flex;flex-direction:column;gap:8px;padding-top:14px}
.marca{display:flex;align-items:center;gap:10px}
.marca img{height:40px;width:auto;max-width:100%}
.eyebrow{font-family:var(--f-titulo);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--amarelo)}
h1{font-family:var(--f-titulo);font-weight:900;font-size:32px;line-height:1;margin:2px 0 0;text-transform:uppercase;letter-spacing:-.01em}
.meta{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:13px;border:1px solid var(--linha);border-radius:999px;padding:4px 10px;display:inline-flex;align-items:center;gap:6px}
.pill b{color:var(--amarelo);font-family:var(--f-num);font-weight:500}
.semnav{padding:3px 4px}
.semnav button{width:30px;height:30px;border-radius:50%;border:1px solid var(--linha);background:none;font-weight:700}
.semnav button:disabled{opacity:.3;cursor:default}
.semnav small{color:var(--cinza);font-size:12px}
.status{font-size:12px;color:var(--cinza);display:flex;align-items:center;gap:6px;background:none;border:0;padding:0;text-align:left}
.status::before{content:"";flex:0 0 8px;height:8px;border-radius:50%;background:var(--cinza)}
.status.ok::before{background:var(--verde)}
.status.salvando::before{background:var(--amarelo)}
.status.local::before{background:var(--amarelo)}
.status.erro{color:var(--vermelho)}.status.erro::before{background:#FF5A4F}

.dias{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--preto);display:flex;gap:6px;padding-block:10px}
.dia{flex:1 1 0;min-width:0;border:1px solid var(--linha);background:var(--carvao);border-radius:10px;padding:7px 2px;display:flex;flex-direction:column;align-items:center;gap:1px}
.dia small{font-size:11px;color:var(--cinza);letter-spacing:.06em}
.dia strong{font-family:var(--f-titulo);font-weight:800;font-size:17px;white-space:nowrap}
.dia.hoje small{color:var(--amarelo)}
.dia[aria-selected="true"]{background:var(--amarelo);color:var(--preto);border-color:var(--amarelo)}
.dia[aria-selected="true"] small{color:var(--preto)}
.dia.feito strong::after{content:" ✓";color:var(--verde)}
.dia[aria-selected="true"].feito strong::after{color:var(--preto)}

.aviso-card{background:var(--carvao);border:1px solid var(--linha);border-left:4px solid var(--amarelo);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.aviso-card h3{margin:0;font-family:var(--f-titulo);font-weight:800;font-size:16px;text-transform:uppercase;letter-spacing:.02em}
.aviso-card p{margin:0;font-size:14px;color:#D9D8D2}
.aviso-card .acoes{margin-top:4px}
.aviso-card.ok{border-left-color:var(--verde)}

.tit-dia{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2{font-family:var(--f-titulo);font-weight:800;font-size:22px;margin:0;text-transform:uppercase}
.contagem{font-size:13px;color:var(--cinza);font-variant-numeric:tabular-nums;white-space:nowrap}
.ex{background:var(--carvao);border:1px solid var(--linha);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ex.ok{border-color:var(--verde)}
.ex-top{display:flex;gap:10px;align-items:flex-start}
.num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--amarelo);color:var(--preto);font-family:var(--f-titulo);font-weight:800;display:grid;place-items:center;font-size:14px}
.ex.ok .num{background:var(--verde)}
.ex-nome{min-width:0;flex:1}
.ex-nome h3{margin:0;font-size:16px;font-weight:600;line-height:1.25}
.ex-nome p{margin:2px 0 0;font-size:13px;color:var(--cinza)}
.tec{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--preto);background:var(--branco);border-radius:4px;padding:1px 6px;margin-top:4px}
.obs{font-size:13px;background:#1F1F1C;border-radius:8px;padding:8px 10px}
.esforco{display:flex;flex-direction:column;gap:6px}
.esforco>span{font-size:13px;color:var(--cinza)}
.esforco>div{display:flex;gap:6px;flex-wrap:wrap}
.esforco button{border:1px solid var(--linha);background:var(--preto);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;font-family:var(--f-num)}
.esforco button[aria-pressed="true"]{background:var(--amarelo);color:var(--preto);border-color:var(--amarelo)}
.agenda{background:var(--carvao);border:1px solid var(--linha);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.agenda p,.agenda label{margin:6px 0 0;display:block}
.agenda .campo input{font-size:16px}
.imgbox{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.85);display:grid;place-items:center;padding:16px}
.imgbox>div{max-width:420px;width:100%;display:flex;flex-direction:column;gap:10px}
.imgbox img{width:100%;height:auto;border-radius:12px;max-height:70vh;object-fit:contain}
.dica{font-size:13px;background:#1F1F1C;border-left:3px solid var(--amarelo);border-radius:8px;padding:8px 10px}
.dica b{color:var(--amarelo);font-weight:600}
.recorde{font-size:13px;font-weight:600;color:var(--preto);background:var(--amarelo);border-radius:8px;padding:7px 10px}
.series{display:flex;flex-direction:column;gap:8px}
.serie{display:grid;grid-template-columns:30px 1fr 1fr;gap:6px 8px;align-items:center}
.serie>span{font-family:var(--f-num);font-size:13px;color:var(--cinza)}
.campo{display:flex;align-items:center;background:var(--preto);border:1px solid var(--linha);border-radius:8px;padding:0 10px;min-width:0}
.campo:focus-within{border-color:var(--amarelo)}
.campo input{width:100%;min-width:0;background:none;border:0;color:var(--branco);font-family:var(--f-num);font-size:18px;padding:9px 0;outline:none}
.campo input::placeholder{color:var(--apagado)}
.campo label{font-size:12px;color:var(--cinza);flex:0 0 auto}
.antes{grid-column:2/4;font-size:12px;color:var(--cinza);margin-top:-2px;font-variant-numeric:tabular-nums}
.confere{grid-column:2/4;font-size:12px;color:var(--amarelo);margin-top:-2px}
.acoes{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--linha);background:none;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--branco);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.amarelo{background:var(--amarelo);color:var(--preto);border-color:var(--amarelo)}
.btn.tem{border-color:var(--amarelo);color:var(--amarelo)}
.recado{display:flex;flex-direction:column;gap:6px}
.recado textarea{width:100%;min-height:64px;resize:vertical;background:var(--preto);color:var(--branco);border:1px solid var(--linha);border-radius:8px;padding:9px 10px;font:inherit;font-size:15px}
.recado textarea:focus{border-color:var(--amarelo);outline:none}
.recado small{font-size:12px;color:var(--cinza)}
.cardio{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vazio{color:var(--cinza);padding:24px 0;text-align:center}
.grande{width:100%;border:0;border-radius:14px;padding:16px;font-family:var(--f-titulo);font-weight:800;font-size:17px;text-transform:uppercase;letter-spacing:.04em;background:var(--amarelo);color:var(--preto)}
.grande.sec{background:none;border:1px solid var(--linha);color:var(--branco)}

.timer{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--amarelo);color:var(--preto);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px;box-shadow:0 -8px 30px rgba(0,0,0,.5)}
.timer .t{font-family:var(--f-num);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.timer .r{flex:1;min-width:0;font-size:13px;font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.timer button{border:2px solid var(--preto);background:none;border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;color:var(--preto)}
.timer.fim{background:var(--verde)}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--branco);color:var(--preto);font-weight:700;font-size:14px;padding:10px 16px;border-radius:999px;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:calc(100% - 32px);text-align:center}
.resumo{background:var(--carvao);border:1px solid var(--linha);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.resumo pre{margin:0;white-space:pre-wrap;font-family:var(--f-num);font-size:12px;max-height:320px;overflow:auto}
.nota{font-size:12px;color:var(--cinza)}
.msg{background:var(--carvao);border:1px solid var(--linha);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg h2{font-size:18px}
.msg p{margin:0}
.carregando{color:var(--cinza);padding:32px 0;text-align:center}
.passos{margin:8px 0 0;padding-left:20px;font-size:14px;color:#D9D8D2;display:flex;flex-direction:column;gap:4px}
.como summary{cursor:pointer;color:var(--amarelo);font-weight:600;font-size:14px}
.como p{margin-top:8px}
@media (prefers-reduced-motion:no-preference){.ex{transition:border-color .2s}.dia{transition:background .15s}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="marca"><img src="icons/logo-horizontal.svg" alt="Lucas Gabriel · Treinador" width="193" height="40"></div>
    <h1 id="nome">Treino da semana</h1>
    <div class="meta" id="meta" hidden>
      <span class="pill semnav"><button type="button" id="semAnt" aria-label="Semana anterior">‹</button>Semana <b id="semana"></b><small id="datas"></small><button type="button" id="semProx" aria-label="Próxima semana">›</button></span>
      <span class="pill">Faixa <b id="faixa"></b> reps</span>
      <span class="pill" id="regen" hidden>Semana regenerativa: <b>séries reduzidas</b></span>
      <span class="pill">Descanso <b id="desc"></b></span>
    </div>
    <button type="button" class="status" id="status" hidden></button>
  </header>

  <div id="avisos" class="wrap" style="gap:10px"></div>
  <nav class="dias" id="dias" role="tablist" aria-label="Dias da semana" hidden></nav>
  <main id="tela" class="wrap" style="gap:12px"><p class="carregando">Abrindo o seu treino…</p></main>

  <section class="resumo" id="envio" hidden>
    <h2>Registro da semana</h2>
    <p class="nota">Tudo o que você anota já vai para a sua planilha. Este resumo é para mandar no WhatsApp, se quiser.</p>
    <pre id="texto"></pre>
    <button class="btn amarelo" id="copiar" type="button">Copiar registro</button>
  </section>
</div>

<div class="timer" id="timer" hidden role="timer" aria-live="polite">
  <span class="t" id="tempo">1:30</span>
  <span class="r" id="trotulo">Descanso</span>
  <button type="button" id="mais">+15s</button>
  <button type="button" id="parar">Fechar</button>
</div>
<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
